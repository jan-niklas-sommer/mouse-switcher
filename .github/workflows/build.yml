name: Build and Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build release
        run: cargo build --release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mouse-switcher
          path: |
            target/release/mouse-switcher.exe
            settings.toml

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: mouse-switcher
          path: ./release

      - name: Create ZIP
        run: |
          cd release
          zip ../mouse-switcher-${{ github.ref_name }}.zip mouse-switcher.exe settings.toml

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: mouse-switcher-${{ github.ref_name }}.zip
          generate_release_notes: true
