[package]
name = "mouse-switcher"
version = "1.0.0"
edition = "2021"
description = "Lightweight Windows mouse sensitivity switcher for gaming"

[dependencies]
windows = { version = "0.59", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_SystemInformation",
    "Win32_Foundation",
] }
tray-icon = "0.19"
global-hotkey = "0.6"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
dirs = "6"
crossbeam-channel = "0.5"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
